[package]
name = "desktop"
description = "ESP32-OS: Desktop (Compositor an der Anzeige-Pipeline, Touch-Eingabe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[build-dependencies]
# Symbole beim Bauen zerlegen und vorskalieren (build.rs, O1)
kolibri = { path = "../kolibri" }
# nur beim Bauen (gut packen; entpackt wird mit kolibri::dekoder::inflate,
# landet nicht in der Firmware)
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[features]
# Guition JC4880P443C_I_W (board name in the About dialog)
guition = []

[dependencies]
kern = { path = "../kern" }
kolibri = { path = "../kolibri" }
konsole = { path = "../konsole" }
pudding-core = { path = "../game" }
# Musikplayer (A5): MP3-Decoder in reinem Rust (Port von minimp3, MIT/Apache-2.0);
# ohne SIMD (`wide`) und ohne Layer I/II
nanomp3 = { version = "0.2", default-features = false, features = ["std"] }

# 32 Bit (i686, Board): Browser (NetSurf, B1)
[target.'cfg(target_pointer_width = "32")'.dependencies]
netsurf = { path = "../netsurf" }

[dev-dependencies]
spatz = { path = "../../spatz", default-features = false }
